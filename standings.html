<!DOCTYPE html>
<html lang="en">
<head>
<script>
  try { if (localStorage.getItem('sureodds_theme') === 'light') document.documentElement.setAttribute('data-theme','light'); } catch(e){}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standings — SureOdds Hub</title>
<meta name="description" content="League table and standings.">
<meta name="theme-color" content="#0E1B15">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230E1B15' stroke='%23E8B94B' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23E8B94B' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23E8B94B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1B15; --bg-elev:#152B21; --bg-card:#183326; --line:#254435;
    --text:#F2F0E6; --text-dim:#9FB3A8;
    --gold:#E8B94B; --green:#2FA972; --red:#E2574C;
  }
  :root[data-theme="light"]{
    --bg:#FAF8F2; --bg-elev:#FFFFFF; --bg-card:#FFFFFF; --line:#E4E0D3;
    --text:#16261C; --text-dim:#66756B;
    --gold:#B8862A; --green:#1E7A4C; --red:#C0392B;
  }
  [data-theme="light"] header.top{background:rgba(250,248,242,0.92);}
  .theme-toggle-btn{
    background:var(--bg-card); border:1px solid var(--line); color:var(--text);
    width:32px; height:32px; border-radius:50%; font-size:0.9rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; flex:0 0 auto;
  }
  .theme-toggle-btn:active{transform:scale(0.92);}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);}
  body{font-family:'Inter',system-ui,sans-serif; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  h1,h2{font-family:'Oswald',sans-serif; font-weight:600; margin:0;}
  a{color:inherit;}
  .wrap{max-width:760px; margin:0 auto; padding:0 18px;}

  header.top{position:sticky; top:0; z-index:10; background:rgba(14,27,21,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:14px 0;}
  header.top .wrap{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:8px;}
  .brand .mark{color:var(--gold); font-family:'Oswald',sans-serif; font-weight:700; font-size:1.3rem;}
  .brand .sub{color:var(--text-dim); font-size:0.78rem;}
  .back-link{color:var(--text-dim); font-size:0.82rem; text-decoration:none;}

  .hero{padding:24px 0 6px;}
  .hero h1{font-size:1.4rem;}
  .hero p{color:var(--text-dim); font-size:0.85rem; margin-top:6px;}

  .table-wrap{overflow-x:auto; margin:18px 0 40px;}
  table.standings{width:100%; border-collapse:collapse; font-size:0.82rem; min-width:480px;}
  table.standings th{
    text-align:center; color:var(--text-dim); font-weight:500; font-size:0.7rem;
    padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.standings th:first-child, table.standings td:first-child{text-align:left; padding-left:4px;}
  table.standings th.team-col, table.standings td.team-col{text-align:left;}
  table.standings td{padding:9px 6px; border-bottom:1px solid var(--line); text-align:center;}
  .rank-cell{color:var(--text-dim); width:24px;}
  .team-cell{display:flex; align-items:center; gap:8px; min-width:140px;}
  .team-cell img{width:20px; height:20px; object-fit:contain; flex:0 0 auto;}
  .pts-cell{font-weight:700; color:var(--gold);}
  .zone-line{border-left:3px solid transparent;}
  .zone-title{color:var(--green);}
  .zone-relegation{color:var(--red);}

  .empty-note{color:var(--text-dim); font-size:0.9rem; text-align:center; padding:30px 18px; border:1px dashed var(--line); border-radius:10px; margin:20px 0;}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a href="index.html" class="brand" style="text-decoration:none;">
      <svg width="26" height="26" viewBox="0 0 64 64" style="flex:0 0 auto;">
        <circle cx="32" cy="32" r="30" fill="#0E1B15" stroke="#E8B94B" stroke-width="4"/>
        <circle cx="32" cy="32" r="14" fill="none" stroke="#E8B94B" stroke-width="3"/>
        <circle cx="32" cy="32" r="5" fill="#E8B94B"/>
      </svg>
      <span class="mark">SureOdds</span><span class="sub">HUB</span>
    </a>
    <div style="display:flex; align-items:center; gap:12px;">
      <a class="back-link" href="live.html">&larr; Back to Live</a>
      <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark theme">🌙</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <h1 id="league-title">League Table</h1>
    <p>Updated from ESPN's standings feed.</p>
  </section>
  <div id="standings-wrap"><div class="empty-note">Loading table…</div></div>
</div>

<script>
function toggleTheme() {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  if (isLight) { document.documentElement.removeAttribute("data-theme"); localStorage.setItem("sureodds_theme", "dark"); }
  else { document.documentElement.setAttribute("data-theme", "light"); localStorage.setItem("sureodds_theme", "light"); }
  updateThemeIcon();
}
function updateThemeIcon() {
  const btn = document.getElementById("theme-toggle");
  if (!btn) return;
  btn.textContent = document.documentElement.getAttribute("data-theme") === "light" ? "☀️" : "🌙";
}
updateThemeIcon();

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { cache: "no-store", signal: controller.signal }).finally(() => clearTimeout(timer));
}
function findStat(stats, names) {
  for (const name of names) {
    const s = (stats || []).find((x) => (x.name || x.abbreviation || "").toLowerCase() === name);
    if (s) return s.displayValue ?? s.value;
  }
  return null;
}

const params = new URLSearchParams(location.search);
const SLUG = params.get("slug");
const LEAGUE_NAME = params.get("league") || "League Table";
document.getElementById("league-title").textContent = LEAGUE_NAME;
document.title = `${LEAGUE_NAME} Standings — SureOdds Hub`;

async function loadStandings() {
  const wrap = document.getElementById("standings-wrap");
  if (!SLUG) {
    wrap.innerHTML = `<div class="empty-note">No league specified.</div>`;
    return;
  }
  try {
    const res = await fetchWithTimeout(`https://site.api.espn.com/apis/v2/sports/soccer/${SLUG}/standings`, 8000);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();

    // A single-table league (EPL, La Liga, etc.) has one group under children[0].
    // A competition with divisions (Nations League's A/B/C/D, Champions League
    // groups) has MULTIPLE children, each its own mini-table — reading only
    // children[0] silently dropped every group except the first.
    let groups = [];
    if (Array.isArray(data.children) && data.children.length > 0) {
      groups = data.children
        .map((child) => ({
          name: child.name || child.abbreviation || "",
          entries: child.standings && child.standings.entries,
        }))
        .filter((g) => Array.isArray(g.entries) && g.entries.length > 0);
    } else if (data.standings && Array.isArray(data.standings.entries)) {
      groups = [{ name: "", entries: data.standings.entries }];
    }

    if (groups.length === 0) throw new Error("no entries");

    function buildRows(entries) {
      return entries.map((e) => {
        const team = e.team || {};
        const stats = e.stats || [];
        return {
          name: team.shortDisplayName || team.displayName || team.name || "Team",
          logo: team.logo || (team.logos && team.logos[0] && team.logos[0].href) || "",
          rank: findStat(stats, ["rank"]) ?? "-",
          played: findStat(stats, ["gamesplayed", "played"]) ?? "-",
          wins: findStat(stats, ["wins"]) ?? "-",
          draws: findStat(stats, ["ties", "draws"]) ?? "-",
          losses: findStat(stats, ["losses"]) ?? "-",
          gd: findStat(stats, ["pointdifferential", "goaldifferential", "differential"]) ?? "-",
          pts: findStat(stats, ["points"]) ?? "-",
        };
      });
    }

    function tableHtml(rows) {
      return `
        <div class="table-wrap">
          <table class="standings">
            <thead><tr>
              <th>#</th><th class="team-col">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th>
            </tr></thead>
            <tbody>
              ${rows.map((r) => `
                <tr>
                  <td class="rank-cell">${esc(r.rank)}</td>
                  <td class="team-col"><div class="team-cell"><img src="${esc(r.logo)}" alt="" onerror="this.style.display='none'"><span>${esc(r.name)}</span></div></td>
                  <td>${esc(r.played)}</td>
                  <td>${esc(r.wins)}</td>
                  <td>${esc(r.draws)}</td>
                  <td>${esc(r.losses)}</td>
                  <td>${esc(r.gd)}</td>
                  <td class="pts-cell">${esc(r.pts)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }

    wrap.innerHTML = groups.map((g) => `
      ${g.name ? `<h2 style="font-size:1rem; margin:20px 0 4px;">${esc(g.name)}</h2>` : ""}
      ${tableHtml(buildRows(g.entries))}
    `).join("");
  } catch (e) {
    wrap.innerHTML = `<div class="empty-note">Standings aren't available for this competition right now — this is more common for cup/qualifying competitions than for regular leagues.</div>`;
  }
}
loadStandings();
</script>
</body>
</html>
